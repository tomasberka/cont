# Fact keyword -> product search terms (matched against product blob).
# First matching rule wins; terms are tried in order.
product_rules:
  - triggers: [virus, hacker, kyber, cyber, security]
    terms: [antivir, zabezpec, software]
  - triggers: [procesor, processor, microprocessor, cpu, intel, amd, tranzistor, transistor, cip, chip, polovodic, semiconductor]
    terms: [procesory, procesor]
  - triggers: [nvidia, graficka, graphics, gpu]
    terms: [graficke karty, graficka]
  - triggers: [mys, mouse]
    terms: [mysi, mys]
  - triggers: [klavesnice, keyboard]
    terms: [klavesnice]
  - triggers: [monitor, displej, display, televize, television]
    terms: [monitory, monitor, televiz]
  - triggers: [internet, web, www, arpanet, ethernet, sit, network, wifi, wi-fi, router]
    terms: [routery, router, sitov, wifi]
  - triggers: [telefon, smartphone, iphone, mobil, phone]
    terms: [mobilni telefony, telefon, mobil]
  - triggers: [playstation, nintendo, xbox, videohra, video game, konzole, atari, commodore]
    terms: [konzole, herni, gaming]
  - triggers: [disketa, floppy, pevny disk, hard disk, usb, pamet, memory, storage]
    terms: [pameti, disky, ssd, usb]
  - triggers: [notebook, laptop]
    terms: [notebooky, notebook]
  - triggers: [pocitac, computer, ibm, macintosh, apple, microsoft, windows, linux, operacni system, operating system, programator, programmer, turing, algoritmus, algorithm, software]
    terms: [stolni pocitace, pocitac]
  - triggers: [sluchatka, headphones, audio, zvuk, sound, radio]
    terms: [sluchatka, audio]
  - triggers: [kalkulacka, calculator]
    terms: [kalkulacky, kalkulacka]

# Product priority (margin proxy — TUNE THIS with real margin knowledge).
# Feed carries no margin data, so selection prefers/penalizes by terms matched
# against the product blob. Only in-stock products (DELIVERY_DATE=0) are ever
# picked; among candidates the highest-priority tier wins, then daily rotation.
product_priority:
  boost:        # vlastní sestavy a privátní řada = typicky nejvyšší marže
    - hellocomp
    - gamer
  penalty:      # nízkomaržové položky (TRAY CPU bez krabice apod.)
    - tray

# When no fact matches (evergreen day): rotate through these category terms.
evergreen_terms:
  - stolni pocitace
  - graficke karty
  - procesory
  - mysi
  - klavesnice
  - sluchatka
  - monitory
  - mobilni telefony
