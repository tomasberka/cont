# Keyword rules for the contenthub pipeline.
# All matching is done on lowercase, diacritics-stripped text
# ("grafická karta" -> "graficka karta"), so write triggers without diacritics.
#
# tech_scoring: words that make an "on this day" fact TECH-relevant.
#   Higher weight = stronger signal. A fact must reach min_score to be used;
#   otherwise the pipeline falls back to an evergreen product post.
#
# product_rules: fact keywords -> search terms matched against
#   product name + category + manufacturer in the Shoptet feed.

min_score: 3

tech_scoring:
  # computing (cs + en, diacritics stripped)
  pocitac: 4        # počítač
  computer: 4
  procesor: 4
  processor: 4
  microprocessor: 5
