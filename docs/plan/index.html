<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>contenthub · dashboard — srpen 2026</title>
<style>
:root{
  --ink:#0F1118;--mid:#18243C;--blue:#284C87;--accent:#2962CD;
  --bright:#4D7FC4;--muted:#BCCAE0;--soft:#8fa3c4;
  --glass:rgba(24,36,60,.66);--line:rgba(77,127,196,.30);
  --k-event:#3E7BFF;--k-selected:#7C5CFF;--k-birth:#3DDC97;--k-death:#8fa3c4;
  --ok:#3DDC97;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;background:var(--ink);
  background-image:
    radial-gradient(1100px 520px at 12% -8%, rgba(41,98,205,.35) 0%, transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(62,123,255,.22) 0%, transparent 50%),
    linear-gradient(165deg,#0F1118 0%,#14203a 48%,#1b2f57 100%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--bright)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(77,127,196,.4);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}

/* ───────── Sidebar ───────── */
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);
  background:rgba(13,16,24,.62);backdrop-filter:blur(14px);padding:22px 16px 40px;z-index:5}
@media(max-width:960px){.app{grid-template-columns:1fr}
  .side{position:relative;height:auto;max-height:52vh;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:12px;margin:0 4px 6px}
.brand .orb{width:34px;height:34px;border-radius:11px;flex:none;position:relative;
  background:linear-gradient(135deg,var(--accent),#16306b);box-shadow:0 0 18px rgba(41,98,205,.55)}
.brand .orb::after{content:"";position:absolute;inset:9px;border-radius:5px;background:rgba(255,255,255,.85)}
.brand h1{margin:0;font-size:16px;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:11px;color:var(--soft)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 4px 12px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat b{display:block;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:10.5px;color:var(--soft)}
.lbl{font-size:10px;letter-spacing:1.4px;color:var(--soft);text-transform:uppercase;margin:14px 4px 7px}
.search{width:100%;padding:10px 12px 10px 34px;border-radius:11px;border:1px solid var(--line);
  background:rgba(13,16,24,.6) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%234D7FC4' stroke-width='2'><circle cx='6' cy='6' r='5'/><path d='M10 10l3 3'/></svg>") 11px center no-repeat;
  color:#fff;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(41,98,205,.25)}
.search::placeholder{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);
  background:rgba(24,36,60,.45);color:var(--soft);transition:.15s}
.chip:hover{border-color:var(--bright);color:#fff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(41,98,205,.4)}
.daylist{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.daybtn{display:grid;grid-template-columns:30px 44px 1fr auto;gap:10px;align-items:center;
  padding:8px 9px;border-radius:13px;border:1px solid transparent;text-align:left;transition:.15s}
.daybtn:hover{background:rgba(41,98,205,.12);border-color:var(--line)}
.daybtn.on{background:linear-gradient(90deg,rgba(41,98,205,.30),rgba(41,98,205,.12));
  border-color:var(--accent)}
.daybtn .n{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
.daybtn .thumb{width:44px;height:55px;border-radius:8px;overflow:hidden;background:#0a0c12;border:1px solid var(--line)}
.daybtn .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.daybtn .meta{min-width:0}
.daybtn .meta b{display:block;font-size:12px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daybtn .meta span{display:block;font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.daybtn .dow{font-size:10px;color:var(--bright);font-weight:800;letter-spacing:.5px}
.daybtn.hide{display:none}

/* ───────── Main ───────── */
.main{min-width:0;padding:0 0 80px;position:relative}
@media(max-width:960px){.main{padding-bottom:60px}}
.hero{position:relative;overflow:hidden;padding:46px 42px 38px;
  border-bottom:1px solid var(--line);background:rgba(13,16,24,.28)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:float 14s ease-in-out infinite}
.hero::before{width:340px;height:340px;background:rgba(41,98,205,.55);top:-120px;right:-60px}
.hero::after{width:260px;height:260px;background:rgba(62,123,255,.4);bottom:-140px;right:24%;animation-delay:-7s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.hero .crumb{position:relative;font-size:12px;color:var(--bright);letter-spacing:.4px;margin-bottom:14px}
.hero .crumb b{color:#fff}
.hero h2{position:relative;margin:0 0 12px;font-size:clamp(26px,4vw,44px);line-height:1.12;max-width:860px;letter-spacing:-.3px}
.hero .sub{position:relative;color:var(--muted);font-size:15px;max-width:720px;line-height:1.6}
.hero .tags{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(24,36,60,.5)}
.tag.acc{background:var(--accent);border-color:var(--accent);font-weight:700}
.tag.style{text-transform:capitalize}
.tag.tech{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.45);color:#7af0c0}
.stage{padding:28px 42px 0;max-width:1240px}
@media(max-width:640px){.stage{padding:20px 14px 0}.hero{padding:34px 20px 30px}}
.grid2{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:26px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.sect-head{display:flex;align-items:baseline;gap:14px;margin:34px 0 16px}
.sect-head h3{margin:0;font-size:20px;letter-spacing:-.2px}
.sect-head .count{font-size:12px;color:var(--soft)}
.sect-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ───────── Carousel ───────── */
.car-wrap{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px;
  position:sticky;top:18px;backdrop-filter:blur(8px)}
@media(max-width:1100px){.car-wrap{position:relative;top:0}}
.car{position:relative;aspect-ratio:4/5;border-radius:15px;overflow:hidden;background:#0a0c12;
  user-select:none;touch-action:pan-y;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;transform:scale(1.02)}
.car img.on{opacity:1;pointer-events:auto;transform:scale(1)}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border-radius:50%;background:rgba(13,16,24,.7);border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;z-index:2;backdrop-filter:blur(6px);transition:.15s}
.car .nav:hover{background:var(--accent);border-color:var(--accent)}
.car .prev{left:11px}.car .next{right:11px}
.car .dots{position:absolute;left:0;right:0;bottom:13px;display:flex;justify-content:center;gap:7px;z-index:2}
.car .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s}
.car .dot.on{background:#fff;transform:scale(1.2)}
.car .sn{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:700;
  background:rgba(13,16,24,.7);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.car .hint{position:absolute;top:12px;left:12px;z-index:2;font-size:10.5px;color:var(--muted);
  background:rgba(13,16,24,.6);padding:4px 10px;border-radius:99px;opacity:0;transition:.3s}
.car:hover .hint{opacity:1}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.thumbs button{border-radius:11px;overflow:hidden;border:2px solid transparent;opacity:.68;transition:.15s}
.thumbs button.on,.thumbs button:hover{border-color:var(--accent);opacity:1}
.thumbs img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.fmt{display:flex;gap:8px;margin-top:12px}
.fmt a{flex:1;text-align:center;font-size:12px;padding:10px;border-radius:11px;
  border:1px solid var(--line);background:rgba(13,16,24,.4);text-decoration:none;color:var(--muted);transition:.15s}
.fmt a:hover{border-color:var(--bright);color:#fff;background:rgba(41,98,205,.15)}

/* ───────── Panels ───────── */
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:17px;padding:18px 20px;backdrop-filter:blur(6px)}
.card h4{margin:0 0 12px;font-size:11px;letter-spacing:1.4px;color:var(--bright);font-weight:800;text-transform:uppercase}
.story{margin:0;font-size:15px;line-height:1.6;color:#eaf0fb}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.keys span{font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(41,98,205,.2);border:1px solid var(--line);color:var(--muted)}
.prod-name{font-weight:700;font-size:17px;line-height:1.35}
.prod-price{display:inline-block;margin-top:8px;font-size:22px;font-weight:800;color:var(--ok)}
.prod-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;
  padding:9px 15px;border-radius:10px;background:var(--accent);text-decoration:none;color:#fff}
.prod-link:hover{filter:brightness(1.12)}
.alts{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.alts li{font-size:13px;color:var(--muted);padding:7px 12px;background:rgba(13,16,24,.35);border-radius:9px;border-left:2px solid var(--accent)}
.alts li b{color:#fff}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.kit{grid-template-columns:1fr}}
.kit .cell{background:rgba(13,16,24,.4);border:1px solid var(--line);border-radius:12px;padding:13px}
.kit .cell b{display:block;font-size:10.5px;color:var(--bright);letter-spacing:.8px;margin-bottom:5px}
.kit .cell span{font-size:13px;line-height:1.45}
.cap-box{position:relative}
.cap-box pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.55;background:rgba(13,16,24,.55);border:1px solid var(--line);
  border-radius:13px;padding:15px 15px 54px;max-height:300px;overflow:auto}
.cap-actions{position:absolute;right:11px;bottom:11px;display:flex;gap:7px}
.btn{font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;background:var(--accent);border:1px solid var(--accent);transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(13,16,24,.75);border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:#fff;border-color:var(--bright)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#05271a}

/* ───────── Event cards ───────── */
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ev{position:relative;border-radius:16px;padding:16px 16px 15px;overflow:hidden;
  background:linear-gradient(160deg,rgba(24,36,60,.8),rgba(15,19,30,.8));
  border:1px solid var(--line);transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:10px}
.ev:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.35);border-color:var(--accent)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ev.k-event::before{background:var(--k-event)}
.ev.k-selected::before{background:var(--k-selected)}
.ev.k-birth::before{background:var(--k-birth)}
.ev.k-death::before{background:var(--k-death)}
.ev-top{display:flex;align-items:center;gap:8px}
.ev .year{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
.ev .year em{font-style:normal;font-size:11px;color:var(--soft);margin-left:3px}
.ev .kind{font-size:10px;font-weight:800;letter-spacing:.7px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--soft);margin-left:auto}
.ev.k-event .kind{color:#9ec2ff;border-color:rgba(62,123,255,.5);background:rgba(62,123,255,.12)}
.ev.k-selected .kind{color:#c5b3ff;border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.12)}
.ev.k-birth .kind{color:#7af0c0;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.12)}
.ev.k-death .kind{color:var(--soft);border-color:var(--line)}
.ev .txt{font-size:13.5px;line-height:1.5;color:var(--muted)}
.ev .techchip{font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#7af0c0;align-self:flex-start;
  padding:3px 8px;border-radius:99px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4)}
.empty-note{color:var(--soft);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:14px}

/* ───────── Day nav ───────── */
.daynav{position:fixed;right:26px;bottom:26px;display:flex;gap:8px;z-index:20}
@media(max-width:960px){.daynav{right:14px;bottom:14px}}
.daynav button{width:46px;height:46px;border-radius:50%;background:rgba(13,16,24,.8);
  border:1px solid var(--line);font-size:20px;display:grid;place-items:center;backdrop-filter:blur(8px);transition:.15s}
.daynav button:hover{background:var(--accent);border-color:var(--accent)}
.daynav .pos{display:flex;align-items:center;font-size:11px;color:var(--soft);padding:0 6px;font-variant-numeric:tabular-nums}

.foot{margin-top:40px;color:var(--soft);font-size:12px;line-height:1.7;padding:0 42px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font-size:10.5px;font-family:ui-monospace,monospace;margin:0 2px;background:rgba(24,36,60,.5)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="orb"></div>
      <div>
        <h1>contenthub</h1>
        <p>Hellocomp.cz · denní pipeline</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="lbl">Hledat</div>
    <input class="search" id="q" type="search" placeholder="Fakt, produkt, událost…" autocomplete="off">
    <div class="lbl">Obsahové okruhy</div>
    <div class="chips" id="pillars"></div>
    <div class="lbl">Vizuální styl</div>
    <div class="chips" id="styles"></div>
    <div class="lbl">Dny — srpen 2026</div>
    <div class="daylist" id="daylist"></div>
  </aside>

  <main class="main" id="main"><div class="empty-note" style="margin:60px 42px">Načítám plán…</div></main>
</div>

<div class="daynav">
  <button id="prev" aria-label="Předchozí den">‹</button>
  <span class="pos" id="pos">– / –</span>
  <button id="next" aria-label="Další den">›</button>
</div>

<script>
const CZ_DAYS=["Po","Út","St","Čt","Pá","So","Ne"];
const CZ_MONTHS=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const STYLE_L={classic:"Classic",editorial:"Editorial",duotone:"Duotone"};
const K_CLASS={events:"k-event",selected:"k-selected",births:"k-birth",deaths:"k-death"};

let PLAN=[], EVENTS={}, idx=0, slide=0;
let fPillar="all", fStyle="all", query="";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dowOf(d){return CZ_DAYS[(d.getDay()+6)%7];}

async function boot(){
  const [p,e]=await Promise.all([fetch("PLAN.json"),fetch("EVENTS.json")]);
  PLAN=await p.json(); EVENTS=await e.json();
  PLAN.sort((a,b)=>a.date.localeCompare(b.date));
  buildSidebar();
  let start=0;
  const h=location.hash.replace(/^#/,"");
  if(h){const i=PLAN.findIndex(x=>x.date===h||x.dir===h); if(i>=0) start=i;}
  select(start);
  $("#prev").onclick=()=>stepDay(-1);
  $("#next").onclick=()=>stepDay(1);
  window.addEventListener("keydown",onKey);
}

function buildSidebar(){
  const n=PLAN.length, facts=PLAN.filter(e=>e.fact).length;
  const pillars={},styles={};
  let evTotal=0;
  PLAN.forEach(e=>{pillars[e.pillar||"—"]=(pillars[e.pillar||"—"]||0)+1;styles[e.style||"—"]=(styles[e.style||"—"]||0)+1;evTotal+=(EVENTS[e.date]||[]).length;});
  $("#stats").innerHTML=`
    <div class="stat"><b>${n}</b><em>dní</em></div>
    <div class="stat"><b>${facts}</b><em>hl. faktů</em></div>
    <div class="stat"><b>${evTotal}</b><em>událostí</em></div>
    <div class="stat"><b>${Object.keys(pillars).length}</b><em>okruhů</em></div>`;
  $("#pillars").innerHTML=chip("all","Vše",true)+
    Object.entries(pillars).sort((a,b)=>b[1]-a[1]).map(([p,c])=>chip(p,`${p} · ${c}`,false)).join("");
  $("#styles").innerHTML=chip("all","Všechny styly",true)+
    Object.keys(styles).map(s=>chip(s,STYLE_L[s]||s,false)).join("");
  $("#pillars").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;fPillar=b.dataset.v;
    [...$("#pillars").children].forEach(c=>c.classList.toggle("on",c.dataset.v===fPillar));renderList();};
  $("#styles").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;fStyle=b.dataset.v;
    [...$("#styles").children].forEach(c=>c.classList.toggle("on",c.dataset.v===fStyle));renderList();};
  $("#q").oninput=ev=>{query=ev.target.value.trim().toLowerCase();renderList();};
  renderList();
}
function chip(v,label,on){return `<button type="button" class="chip${on?" on":""}" data-v="${esc(v)}">${esc(label)}</button>`;}

function visibleIds(){
  return PLAN.map((e,i)=>({e,i})).filter(({e})=>{
    if(fPillar!=="all"&&(e.pillar||"")!==fPillar)return false;
    if(fStyle!=="all"&&(e.style||"")!==fStyle)return false;
    if(query){const blob=[e.fact,e.product?.name,e.pillar,e.caption,...(e.fact_keywords||[]),
      ...(EVENTS[e.date]||[]).map(x=>x.text)].join(" ").toLowerCase();
      if(!blob.includes(query))return false;}
    return true;}).map(x=>x.i);
}

function renderList(){
  const vis=new Set(visibleIds());
  $("#daylist").innerHTML=PLAN.map((e,i)=>{
    const d=new Date(e.date+"T12:00:00");
    return `<button type="button" class="daybtn${i===idx?" on":""}${vis.has(i)?"":" hide"}" data-i="${i}">
      <span class="n">${d.getDate()}.</span>
      <span class="thumb"><img src="${e.dir||e.date}/post-1-45.jpg" loading="lazy" alt=""></span>
      <span class="meta"><b>${esc(e.fact||"Produktový tip")}</b><span>${esc((e.product?.name||"").slice(0,44))}</span></span>
      <span class="dow">${dowOf(d)}</span>
    </button>`;}).join("");
  $("#daylist").onclick=ev=>{const b=ev.target.closest(".daybtn");if(b)select(+b.dataset.i);};
}

function select(i){
  if(i<0||i>=PLAN.length)return; idx=i; slide=0;
  location.hash=PLAN[i].date;
  document.querySelectorAll(".daybtn").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
  $("#pos").textContent=`${i+1} / ${PLAN.length}`;
  renderMain();
  const b=document.querySelector(`.daybtn[data-i="${i}"]`);
  if(b&&!b.classList.contains("hide"))b.scrollIntoView({block:"nearest"});
}

function renderMain(){
  const e=PLAN[idx], d=new Date(e.date+"T12:00:00");
  const dir=e.dir||e.date, evs=EVENTS[e.date]||[];
  const story=(e.caption||"").split("\n\n")[1]||"";
  const alts=(e.alt_products||[]).map(a=>`<li>${esc(a.name)} · <b>${esc(a.price)}</b></li>`).join("");
  const keys=(e.fact_keywords||[]).map(k=>`<span>${esc(k)}</span>`).join("");
  const s45=[1,2,3].map(n=>`${dir}/post-${n}-45.jpg`);
  const s916=[1,2,3].map(n=>`${dir}/post-${n}.jpg`);
  const evCards=evs.map(ev=>`
    <div class="ev ${K_CLASS[ev.kind]||""}">
      <div class="ev-top"><span class="year">${ev.year??"?"}<em>rok</em></span>
        <span class="kind">${esc(ev.label||ev.kind)}</span></div>
      <div class="txt">${esc(ev.text)}</div>
      ${ev.tech?'<span class="techchip">⚡ TECH</span>':""}
    </div>`).join("");

  $("#main").innerHTML=`
  <div class="hero">
    <div class="crumb">contenthub <b>/</b> srpen 2026 <b>/</b> ${d.getDate()}. ${CZ_MONTHS[d.getMonth()]}</div>
    <h2>${esc(e.fact||"Produktový tip dne")}</h2>
    <p class="sub">${esc(story||"Produkt ze skladu k dnešnímu dni — vygenerováno pipeline.")}</p>
    <div class="tags">
      <span class="tag acc">${esc(e.pillar||"—")}</span>
      <span class="tag style">${esc(STYLE_L[e.style]||e.style||"")}</span>
      <span class="tag">${esc(e.format||"carousel")}</span>
      ${evs.filter(x=>x.tech).length?`<span class="tag tech">${evs.filter(x=>x.tech).length}× tech událost</span>`:""}
      <span class="tag">${dowOf(d)} · ${esc(e.post_time||"")}</span>
    </div>
  </div>
  <div class="stage">
    <div class="grid2">
      <div class="car-wrap">
        <div class="car" id="car">
          ${s45.map((src,i)=>`<img src="${src}" alt="slide ${i+1}" class="${i===0?"on":""}" data-s="${i}" draggable="false">`).join("")}
          <button type="button" class="nav prev">‹</button>
          <button type="button" class="nav next">›</button>
          <div class="dots">${[0,1,2].map(i=>`<button type="button" class="dot${i===0?" on":""}" data-s="${i}"></button>`).join("")}</div>
          <div class="sn"><span id="sn">1</span>/3</div>
          <div class="hint">klik = 9:16 · táhni = další slide</div>
        </div>
        <div class="thumbs" id="thumbs">${s45.map((src,i)=>`<button type="button" class="${i===0?"on":""}" data-s="${i}"><img src="${src}" alt=""></button>`).join("")}</div>
        <div class="fmt">
          <a href="${slides916[0]}" target="_blank" id="open916">Otevřít 9:16 ↗</a>
          <a href="${slides45[0]}" target="_blank" id="open45">Otevřít 4:5 ↗</a>
          <a href="../reels/reel-${e.date}.mp4" target="_blank">🎬 Reel ↗</a>
        </div>
      </div>
      <div class="panel">
        <div class="card">
          <h4>Produkt</h4>
          <div class="prod-name">${esc(e.product?.name||"—")}</div>
          <div class="prod-price">${esc(e.product?.price||"")}</div>
          ${e.product?.url?`<a class="prod-link" href="${esc(e.product.url)}" target="_blank" rel="noopener">Koupit na hellocomp.cz ↗</a>`:""}
          ${alts?`<ul class="alts">${alts}</ul>`:""}
        </div>
        <div class="card">
          <h4>Publikace</h4>
          <div class="kit">
            <div class="cell"><b>DOPORUČENÝ ČAS</b><span>${esc(e.post_time || "—")}</span></div>
            <div class="cell"><b>FORMÁT</b><span>${esc(e.format_tip || "Feed carousel 4:5")}</span></div>
            <div class="cell"><b>REEL</b><span><a href="../reels/reel-${e.date}.mp4" target="_blank">🎬 Přehrát / stáhnout</a></span></div>
          </div>
          ${keys?`<div class="keys">${keys}</div>`:""}
        </div>
        <div class="card">
          <h4>Caption</h4>
          <div class="cap-box">
            <pre id="cap">${esc(e.caption||"")}</pre>
            <div class="cap-actions">
              <button type="button" class="btn ghost" id="dl">Stáhnout .txt</button>
              <button type="button" class="btn" id="copy">Kopírovat</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="sect-head"><h3>V tento den se stalo ještě</h3><span class="count">${evs.length} událostí</span><span class="rule"></span></div>
    <div class="events">${evCards||'<div class="empty-note">Pro tento den nejsou další události.</div>'}</div>
  </div>
  <p class="foot">Používání: <span class="kbd">←</span><span class="kbd">→</span> den ·
    <span class="kbd">mezerník</span> další slide · klik na slide otevře 9:16 master ·
    data z <code>PLAN.json</code> + <code>EVENTS.json</code>, slidy v <code>${esc(dir)}/</code>.
    Další události: Wikimedia „on this day“ (cs+en), tech-relevantní zvýrazněny.</p>`;

  wireCarousel(s45,s916);
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(e.caption||"");const b=$("#copy");b.textContent="Zkopírováno ✓";b.classList.add("ok");setTimeout(()=>{b.textContent="Kopírovat";b.classList.remove("ok");},1600);}catch{const r=document.createRange();r.selectNodeContents($("#cap"));const s=getSelection();s.removeAllRanges();s.addRange(r);}};
  $("#dl").onclick=()=>{const bl=new Blob([e.caption||""],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=`caption-${e.date}.txt`;a.click();URL.revokeObjectURL(a.href);};
}

function wireCarousel(s45,s916){
  const car=$("#car");
  const set=s=>{slide=(s+3)%3;
    car.querySelectorAll("img").forEach((im,i)=>im.classList.toggle("on",i===slide));
    car.querySelectorAll(".dot").forEach((dd,i)=>dd.classList.toggle("on",i===slide));
    $("#thumbs").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===slide));
    $("#sn").textContent=slide+1;$("#open916").href=s916[slide];$("#open45").href=s45[slide];};
  car.querySelector(".prev").onclick=()=>set(slide-1);
  car.querySelector(".next").onclick=()=>set(slide+1);
  car.querySelectorAll(".dot").forEach(dd=>dd.onclick=()=>set(+dd.dataset.s));
  $("#thumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>set(+b.dataset.s));
  let x0=null;
  car.addEventListener("pointerdown",e=>{x0=e.clientX;car.setPointerCapture(e.pointerId);});
  car.addEventListener("pointerup",e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)set(slide+(dx<0?1:-1));});
  car.querySelectorAll("img").forEach(im=>{im.style.cursor="zoom-in";im.onclick=()=>window.open(s916[+im.dataset.s],"_blank");});
}

function stepDay(d){const vis=visibleIds();if(!vis.length)return;let p=vis.indexOf(idx);if(p<0){select(vis[0]);return;}p=(p+d+vis.length)%vis.length;select(vis[p]);}

function onKey(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight"&&!e.shiftKey){e.preventDefault();stepDay(1);}
  else if(e.key==="ArrowLeft"&&!e.shiftKey){e.preventDefault();stepDay(-1);}
  else if(e.key===" "||e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();const n=$(".car .next");if(n)n.click();}
  else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();const p=$(".car .prev");if(p)p.click();}
}

boot().catch(err=>{$("#main").innerHTML=`<div class="empty-note" style="margin:60px 42px">Nepodařilo se načíst data.<br><small>${esc(err.message)}</small></div>`;});
</script>
</body>
</html>
